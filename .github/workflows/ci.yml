name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: uv sync --extra dev

      - name: Run Ruff Linter
        run: uv run ruff check .

      - name: Run Ruff Formatter validation
        run: uv run ruff format --check .

      - name: Run Pytest
        run: uv run pytest -v tests/
        env:
          DISCORD_TOKEN: dummy
          CRAFTY_URL: http://dummy
          CRAFTY_TOKEN: dummy
